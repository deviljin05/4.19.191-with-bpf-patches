name: Build X6815C Kernel (BPF)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch"
        required: false
        default: "main"
      defconfig:
        description: "Defconfig name (blank = X6815C_defconfig)"
        required: false
        default: ""
      toolchain:
        description: "Clang toolchain (aosp = r383902 / Clang 11.0.1 like the stock kernel; proton is a fallback and may break module ABI)"
        type: choice
        options:
          - aosp
          - proton
        default: aosp
      enable_bpf:
        description: "Enable BPF configs (build fails early if they do not stick)"
        type: boolean
        default: true
      include_dtb:
        description: "Replace the zip's dtb with the one built from source (off = keep the dtb shipped in the repo's AnyKernel3)"
        type: boolean
        default: false
      include_modules:
        description: "Ship built .ko files in the zip (experimental, off = keep stock vendor modules)"
        type: boolean
        default: false
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 5G
  # Required by Android netd / eBPF on a 4.19 kernel
  BPF_REQUIRED: "BPF BPF_SYSCALL BPF_JIT CGROUP_BPF NET_CLS_BPF NET_ACT_BPF NET_CLS_ACT NET_SCH_INGRESS NETFILTER_XT_MATCH_BPF"
  BPF_OPTIONAL: "BPF_JIT_ALWAYS_ON BPF_EVENTS"

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libssl-dev libelf-dev libncurses-dev lz4 perl python3 \
            python-is-python3 rsync unzip zip xz-utils zstd \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          # Old prebuilt AOSP clang may want these; not present on every image
          sudo apt-get install -y --no-install-recommends libtinfo5 libncurses5 || true

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi
          git -C kernel log -1 --oneline

      - name: Resolve defconfig
        working-directory: kernel
        env:
          INPUT_DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          echo "Defconfigs matching x6815c / 6877:"
          ls arch/arm64/configs | grep -iE 'x6815c|6877' || echo "(none)"

          DC="$INPUT_DEFCONFIG"
          [ -z "$DC" ] && [ -f arch/arm64/configs/X6815C_defconfig ] && DC=X6815C_defconfig
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs | grep -iE 'x6815c' | head -n1 || true)
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs | grep -iE '6877.*_defconfig$' | grep -v debug | head -n1 || true)
          if [ -z "$DC" ] || [ ! -f "arch/arm64/configs/$DC" ]; then
            echo "::error::Defconfig not found. Set the 'defconfig' input."
            ls arch/arm64/configs/
            exit 1
          fi
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"
          echo "Using defconfig: $DC"

      - name: Set up toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -o pipefail
          OK=0
          if [ "$TOOLCHAIN" = "aosp" ]; then
            # The stock X6815C kernel was built with AOSP clang r383902 (11.0.1).
            BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads"
            for REF in android11-release android11-qpr3-release android11-qpr2-release \
                       android11-qpr1-release master-kernel-build-2021; do
              rm -rf "$HOME/clang"; mkdir -p "$HOME/clang"
              echo "Trying $REF ..."
              if curl -fsSL --retry 3 --max-time 900 "$BASE/$REF/clang-r383902.tar.gz" -o /tmp/clang.tgz \
                 && tar -xzf /tmp/clang.tgz -C "$HOME/clang" \
                 && [ -x "$HOME/clang/bin/clang" ] \
                 && "$HOME/clang/bin/clang" --version | head -n1 | grep -q '11\.0\.1'; then
                OK=1
                echo "Using AOSP clang r383902 from $REF"
                break
              fi
            done
            rm -f /tmp/clang.tgz
            if [ "$OK" -eq 0 ]; then
              echo "::warning::AOSP clang r383902 could not be downloaded, falling back to Proton-Clang (not the stock compiler; vendor module ABI may differ)"
              rm -rf "$HOME/clang"
            fi
          fi
          if [ "$OK" -eq 0 ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n1
          "$HOME/clang/bin/ld.lld" --version | head -n1

      - name: Set up ccache and make wrapper
        run: |
          # ccache masquerade: a 'clang' symlink to ccache placed ahead of the real clang
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"

          # One shared make wrapper so configure, build and every later step
          # use identical variables. This old MediaTek tree assigns CC internally
          # and its connectivity modules need these variables on the command line.
          cat > "$RUNNER_TEMP/kmake.sh" <<'EOF'
          kmake() {
            make O=out ARCH=arm64 SUBARCH=arm64 \
              CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              HOSTCC=gcc HOSTCXX=g++ \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              TARGET_BUILD_VARIANT=userdebug \
              CONFIG_MTK_COMBO_WIFI_HIF=axi MTK_COMBO_CHIP=CONNAC2X2_SOC5_0 \
              BT_PLATFORM=6877 WLAN_CHIP_ID=6877 \
              MTK_ANDROID_WMT=y MTK_ANDROID_EMI=y WIFI_IP_SET=1 \
              MTK_WLAN_SERVICE=yes CONNAC_VER=2_0 CFG_BUILD_CONNAC2=true \
              KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
              "$@"
          }
          EOF
          echo "KMAKE_ENV=$RUNNER_TEMP/kmake.sh" >> "$GITHUB_ENV"
          bash -n "$RUNNER_TEMP/kmake.sh"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Apply BPF patches (optional, patches/bpf/*.patch)
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          PATCH_DIR="$GITHUB_WORKSPACE/patches/bpf"
          shopt -s nullglob
          PATCHES=("$PATCH_DIR"/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "No patches in patches/bpf/, relying on configs only."
            exit 0
          fi
          for p in "${PATCHES[@]}"; do
            if git apply --check "$p" 2>/dev/null; then
              git apply "$p"
              echo "Applied: $(basename "$p")"
            else
              echo "::warning::Skipped (does not apply cleanly, maybe already in source): $(basename "$p")"
            fi
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          BPF: ${{ inputs.enable_bpf }}
        run: |
          source "$KMAKE_ENV"

          # CI-only tweaks. Do NOT force LTO_NONE: the X6815C config uses ThinLTO + CFI
          # (CFI depends on LTO_CLANG) and the stock vendor modules expect that ABI.
          : > ci.config
          echo 'CONFIG_DEBUG_INFO=n' >> ci.config
          if [ "$BPF" = "true" ]; then
            for c in $BPF_REQUIRED $BPF_OPTIONAL; do
              echo "CONFIG_${c}=y" >> ci.config
            done
          fi

          kmake "$DEFCONFIG"

          FRAGS=()
          # The port's own fragment (ACCDET dup-symbol fix, MI_HARDWARE_ID / get_hw_sku, SCS off, ...)
          [ -f x6815c-port/configs/X6815C_lineage.config ] && FRAGS+=(x6815c-port/configs/X6815C_lineage.config)
          FRAGS+=(ci.config)
          scripts/kconfig/merge_config.sh -m -O out out/.config "${FRAGS[@]}"
          kmake olddefconfig

          FAIL=0
          {
            echo "### Config check"
            echo "defconfig: \`$DEFCONFIG\`  fragments: \`${FRAGS[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Invariants for the stock vendor modules / boot to keep working
          if ! grep -q '^# CONFIG_SHADOW_CALL_STACK is not set' out/.config; then
            echo "::error::CONFIG_SHADOW_CALL_STACK must be off (breaks prebuilt bt_drv_6877.ko via x18)"
            FAIL=1
          fi
          for c in LTO_CLANG CFI_CLANG MODULES MODVERSIONS; do
            if ! grep -q "^CONFIG_${c}=y" out/.config; then
              echo "::error::CONFIG_${c} is not enabled (stock ABI expects it)"
              FAIL=1
            fi
          done

          if [ "$BPF" = "true" ]; then
            echo "#### BPF" >> "$GITHUB_STEP_SUMMARY"
            for c in $BPF_REQUIRED; do
              if grep -q "^CONFIG_${c}=y" out/.config; then
                echo "OK      CONFIG_${c}"
                echo "- OK: CONFIG_${c}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::CONFIG_${c} did not stick after olddefconfig"
                grep -E "(^| )CONFIG_${c}[ =]" out/.config || echo "  symbol not in .config at all (missing in Kconfig or unmet dependency)"
                echo "- MISSING: CONFIG_${c}" >> "$GITHUB_STEP_SUMMARY"
                FAIL=1
              fi
            done
            for c in $BPF_OPTIONAL; do
              grep -q "^CONFIG_${c}=y" out/.config || echo "::warning::Optional CONFIG_${c} is not enabled"
            done
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Config checks failed. Stopping before the long build."
            exit 1
          fi

      - name: Build kernel
        working-directory: kernel
        env:
          INC_DTB: ${{ inputs.include_dtb }}
        run: |
          set -o pipefail
          source "$KMAKE_ENV"
          ccache -z

          TARGETS=(Image.gz modules)
          [ "$INC_DTB" = "true" ] && TARGETS+=(dtbs)

          kmake -j"$(nproc)" "${TARGETS[@]}" 2>&1 | tee build.log

          ccache -s

      - name: Save ccache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}

      - name: Collect outputs
        working-directory: kernel
        env:
          INC_DTB: ${{ inputs.include_dtb }}
          INC_MODULES: ${{ inputs.include_modules }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          D="$GITHUB_WORKSPACE/dist"

          if [ -f "$B/Image.gz" ]; then
            cp "$B/Image.gz" "$D/"
            echo "KIMG=Image.gz" >> "$GITHUB_ENV"
          elif [ -f "$B/Image.gz-dtb" ]; then
            cp "$B/Image.gz-dtb" "$D/"
            echo "KIMG=Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f "$B/Image" ]; then
            cp "$B/Image" "$D/"
            echo "KIMG=Image" >> "$GITHUB_ENV"
          else
            echo "::error::No kernel image produced. Check build.log"
            exit 1
          fi

          if [ "$INC_DTB" = "true" ]; then
            DTB=$(find out/arch/arm64/boot/dts -name 'mt6877*.dtb' | head -n1 || true)
            if [ -n "$DTB" ]; then
              cp "$DTB" "$D/dtb"
              echo "Collected dtb: $DTB"
            else
              echo "::warning::include_dtb is on but no mt6877*.dtb was found; keeping the repo dtb"
            fi
          fi

          if [ "$INC_MODULES" = "true" ]; then
            mkdir -p "$D/modules"
            find out -name '*.ko' -exec cp {} "$D/modules/" \;
            ls "$D/modules"
          fi

          cp out/.config "$D/final.config"
          [ -f out/Module.symvers ] && cp out/Module.symvers "$D/Module.symvers"
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        working-directory: ${{ github.workspace }}
        env:
          INC_MODULES: ${{ inputs.include_modules }}
          BPF: ${{ inputs.enable_bpf }}
        run: |
          D="$GITHUB_WORKSPACE/dist"

          # Prefer the AnyKernel3 shipped in the kernel repo: it already has the
          # X6815C device names, banner and the grounded dtb. Fall back to upstream.
          if [ -f kernel/AnyKernel3/anykernel.sh ]; then
            cp -r kernel/AnyKernel3 ak3
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          fi
          rm -rf ak3/.git ak3/.github ak3/README.md

          # drop any stale kernel image / dtb the template shipped, then add ours
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb
          cp "$D/$KIMG" ak3/
          [ -f "$D/dtb" ] && cp "$D/dtb" ak3/dtb

          MODFLAG=0
          if [ "$INC_MODULES" = "true" ] && ls "$D"/modules/*.ko >/dev/null 2>&1; then
            mkdir -p ak3/modules/vendor/lib/modules
            cp "$D"/modules/*.ko ak3/modules/vendor/lib/modules/
            MODFLAG=1
          fi

          TAG=""
          [ "$BPF" = "true" ] && TAG="-BPF"

          sed -i \
            -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER}${TAG} (run ${GITHUB_RUN_NUMBER})|" \
            -e "s|^do.modules=.*|do.modules=${MODFLAG}|" \
            -e "s|^do.cleanup=.*|do.cleanup=1|" \
            ak3/anykernel.sh

          grep -E '^(kernel.string|do.devicecheck|do.modules|do.cleanup|BLOCK|IS_SLOT_DEVICE|RAMDISK_COMPRESSION|PATCH_VBMETA_FLAG)=' ak3/anykernel.sh || true

          ZIP="X6815C-${KVER}${TAG}-run${GITHUB_RUN_NUMBER}.zip"
          (cd ak3 && zip -r9 "$D/$ZIP" . -x '*.git*')
          unzip -l "$D/$ZIP" | tail -n 25
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Show first build errors
        if: failure()
        run: |
          if [ -f kernel/build.log ]; then
            {
              echo "### First errors in build.log"
              echo '```'
              grep -nE 'error:|\*\*\*|undefined symbol|duplicate symbol|No rule to make' kernel/build.log | head -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-build-${{ github.run_number }}
          path: dist/*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Publish release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x6815c-${{ github.run_number }}
          name: X6815C ${{ env.KVER }} (run ${{ github.run_number }})
          files: |
            dist/${{ env.ZIP }}
            dist/final.config
